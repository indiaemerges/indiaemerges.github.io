    <figure class="arc" id="2026-11-26">
      <time datetime="2026-11-26">26 November 2026</time>
      
      <div class="cod-int" data-spec="{&quot;type&quot;: &quot;dots&quot;, &quot;data&quot;: &quot;/charts/data/2026-11-26-gdp-forecasts.csv&quot;, &quot;name&quot;: &quot;forecaster&quot;, &quot;sub&quot;: &quot;detail&quot;, &quot;value&quot;: &quot;forecast_pct&quot;, &quot;lo&quot;: &quot;range_low_pct&quot;, &quot;hi&quot;: &quot;range_high_pct&quot;, &quot;colors&quot;: [[&quot;type&quot;, &quot;Official&quot;, &quot;#F590C6&quot;], [&quot;type&quot;, &quot;Private&quot;, &quot;#6FD3EA&quot;], [&quot;type&quot;, &quot;Poll&quot;, &quot;#F3E67C&quot;]], &quot;refs&quot;: [{&quot;v&quot;: 7.8, &quot;label&quot;: &quot;April to June actual&quot;}], &quot;min&quot;: 6.5, &quot;max&quot;: 8.5, &quot;vname&quot;: &quot;Forecast&quot;, &quot;note&quot;: &quot;note&quot;, &quot;unit&quot;: &quot;Real GDP growth, July to September 2026, % year on year&quot;, &quot;legend&quot;: [[&quot;Official forecast&quot;, &quot;#F590C6&quot;, &quot;dot&quot;], [&quot;Private forecast&quot;, &quot;#6FD3EA&quot;, &quot;dot&quot;], [&quot;Reuters poll median&quot;, &quot;#F3E67C&quot;, &quot;dot&quot;], [&quot;Range of poll forecasts&quot;, &quot;#8a8a8a&quot;, &quot;range&quot;], [&quot;April to June actual&quot;, &quot;#ffffff&quot;, &quot;line&quot;]], &quot;title&quot;: &quot;Will growth hold at 7.8%? Forecasts for Monday&#x27;s GDP number&quot;}"><h3>Will growth hold at 7.8%? Forecasts for Monday&#x27;s GDP number</h3><div class="ctls cod-ui"></div><div class="legend cod-legend"></div><div class="plot"><div class="cod-fallback"><a href="/charts/2026-11-26-gdp-forecasts.png"><img src="/charts/2026-11-26-gdp-forecasts.png" alt="Dot chart of forecasts for India&#x27;s GDP growth in July to September 2026. SBI Research 7.8%. Reuters poll median 7.6%, range 6.6% to 8.2%. ICRA 7.5%. RBI 7.2%. Brickwork Ratings 7.0%. Growth in April to June was 7.8%." loading="lazy"></a></div><div class="cod-plot"></div></div></div>
      <p class="sub2">Forecasts of India&#x27;s real GDP growth for July to September 2026, % year on year. The dashed line is growth in April to June. Official figures are due on 30 November.</p>
      <p>All five forecasts are at or below April to June&#x27;s 7.8%, though some economists in the Reuters poll expect as much as 8.2%. SBI Research is the most optimistic at 7.8%. The RBI&#x27;s Monetary Policy Committee expects 7.2%, already up from the 6.4% it forecast in August. The Reuters poll median is 7.6%, with individual forecasts from 6.6% to 8.2%. We will add the official figure on Monday.</p>
      <p class="src">Source: RBI Monetary Policy Statement, 7 October 2026; ICRA, 17 November 2026; SBI Research Ecowrap, 11 November 2026; Reuters poll, 13 to 18 November 2026, as reported; Brickwork Ratings, as reported by Business Today, 13 November 2026</p>
    </figure>
    <figure class="arc" id="2026-11-25">
      <time datetime="2026-11-25">25 November 2026</time>
      
      <div class="cod-int" data-spec="{&quot;type&quot;: &quot;dumbbell&quot;, &quot;data&quot;: &quot;/charts/data/2026-11-25-us-tariffs.csv&quot;, &quot;name&quot;: &quot;economy&quot;, &quot;sub&quot;: &quot;members&quot;, &quot;a&quot;: [&quot;rate_without_deal_pct&quot;, &quot;Proposed rate, no agreement&quot;, &quot;#F590C6&quot;], &quot;b&quot;: [&quot;rate_with_deal_pct&quot;, &quot;Rate with a trade agreement&quot;, &quot;#6FD3EA&quot;], &quot;gap&quot;: &quot;deal_difference_pp&quot;, &quot;gapName&quot;: &quot;With a deal&quot;, &quot;note&quot;: &quot;note&quot;, &quot;max&quot;: 40, &quot;unit&quot;: &quot;Proposed additional tariff, % on all goods&quot;, &quot;title&quot;: &quot;A trade deal would cut India&#x27;s proposed US tariff from 25% to 17%&quot;}"><h3>A trade deal would cut India&#x27;s proposed US tariff from 25% to 17%</h3><div class="ctls cod-ui"></div><div class="legend cod-legend"></div><div class="plot"><div class="cod-fallback"><a href="/charts/2026-11-25-us-tariffs.png"><img src="/charts/2026-11-25-us-tariffs.png" alt="Chart of proposed US Section 301 tariff rates, without and with a trade agreement. Vietnam 35% or 20%. India 25% or 17%. Singapore 20% or 10%. China 20%, on top of existing 2018 tariffs of 25% or 7.5% on most goods. Bangladesh, Cambodia, Indonesia, Malaysia and Thailand 18%. EU, Japan, Korea, Switzerland and Taiwan 15%." loading="lazy"></a></div><div class="cod-plot"></div></div></div>
      <p class="sub2">New US tariffs proposed on 25 November 2026 under Section 301 (excess manufacturing capacity), % on all goods. A second rate is offered to India, Vietnam and Singapore if they reach a trade agreement. China&#x27;s rate comes on top of its existing 2018 tariffs.</p>
      <p>Without a deal, India&#x27;s proposed rate of 25% is the second highest after Vietnam&#x27;s 35%. With one, India&#x27;s 17% would be a point below the 18% proposed for Bangladesh, Cambodia, Indonesia, Malaysia and Thailand, and three below Vietnam at 20%, though above the 15% for the EU, Japan, Korea, Switzerland and Taiwan. China&#x27;s 20% is added to the 25% or 7.5% tariffs it has paid on most goods since 2018, taking the total on those goods to 45% or 27.5%. The rates are proposals: hearings begin on 25 January 2027.</p>
      <p class="src">Source: Office of the US Trade Representative, Section 301 determinations on structural excess capacity, 25 November 2026</p>
    </figure>
    <figure class="arc" id="2026-11-24">
      <time datetime="2026-11-24">24 November 2026</time>
      
      <div class="cod-int" data-spec="{&quot;type&quot;: &quot;map&quot;, &quot;data&quot;: &quot;/charts/data/2026-11-24-rd-units-by-state.csv&quot;, &quot;state&quot;: &quot;state&quot;, &quot;measures&quot;: [{&quot;col&quot;: &quot;factories_with_rd_unit&quot;, &quot;label&quot;: &quot;Number&quot;, &quot;kind&quot;: &quot;num&quot;, &quot;unit&quot;: &quot;Factories with an R&amp;D unit, 2024-25&quot;, &quot;breaks&quot;: [10, 50, 100, 250, 500]}, {&quot;col&quot;: &quot;pct_factories_with_rd_unit&quot;, &quot;label&quot;: &quot;Share of factories&quot;, &quot;kind&quot;: &quot;pct2&quot;, &quot;unit&quot;: &quot;% of the state&#x27;s factories with an R&amp;D unit, 2024-25&quot;, &quot;breaks&quot;: [0.5, 1, 2, 3]}], &quot;tip&quot;: [[&quot;factories_with_rd_unit&quot;, &quot;Factories with an R&amp;D unit&quot;, &quot;num&quot;], [&quot;factories&quot;, &quot;All factories&quot;, &quot;num&quot;], [&quot;pct_factories_with_rd_unit&quot;, &quot;Share with an R&amp;D unit&quot;, &quot;pct2&quot;]], &quot;title&quot;: &quot;Only 2 in 100 Indian factories have an R&amp;D unit&quot;}"><h3>Only 2 in 100 Indian factories have an R&amp;D unit</h3><div class="ctls cod-ui"></div><div class="legend cod-legend"></div><div class="plot"><div class="cod-fallback"><a href="/charts/2026-11-24-rd-units-by-state.png"><img src="/charts/2026-11-24-rd-units-by-state.png" alt="Map of India showing factories with R&amp;D units by state in 2024-25, by number and as a share of all factories. Maharashtra has the most, 749 (3.41%); Tamil Nadu 634 (1.95%); Gujarat 593 (2.28%); Karnataka 387 (3.06%); Telangana 329 (2.89%). Nationally 1.9% of factories have an R&amp;D unit." loading="lazy"></a></div><div class="cod-plot"></div></div></div>
      <p class="sub2">Factories with an in-house R&amp;D unit, by state, 2024-25. Switch between the number of factories and their share of all factories in the state.</p>
      <p>Of 2,18,543 factories in India in 2024-25, 4,146 (1.9%) had an in-house R&amp;D unit. Maharashtra had the most, 749, followed by Tamil Nadu (634) and Gujarat (593). As a share, Himachal Pradesh (3.54%), Maharashtra (3.41%) and Puducherry (3.31%) lead, leaving aside the Andaman and Nicobar Islands, where 1 of 12 factories has one. In Bihar, Chhattisgarh and Assam, fewer than 1 in 100 factories do.</p>
      <p class="src">Source: MoSPI, Annual Survey of Industries 2024-25 (R&amp;D block)</p>
    </figure>
    <figure class="arc" id="2026-11-23">
      <time datetime="2026-11-23">23 November 2026</time>
      
      <div class="cod-int" data-spec="{&quot;type&quot;: &quot;dumbbell&quot;, &quot;data&quot;: &quot;/charts/data/2026-11-23-anaemia.csv&quot;, &quot;name&quot;: &quot;group&quot;, &quot;sub&quot;: &quot;ages&quot;, &quot;a&quot;: [&quot;nfhs5_pct&quot;, &quot;NFHS-5, 2019–21 (finger-prick blood)&quot;, &quot;#F3E67C&quot;], &quot;b&quot;: [&quot;sampada_pct&quot;, &quot;SAMPADA, 2023–25 (venous blood)&quot;, &quot;#F590C6&quot;], &quot;gap&quot;: &quot;difference_pp&quot;, &quot;gapName&quot;: &quot;Difference&quot;, &quot;note&quot;: &quot;note&quot;, &quot;max&quot;: 70, &quot;unit&quot;: &quot;% of the group with anaemia; difference in percentage points&quot;, &quot;title&quot;: &quot;Did India overestimate anaemia prevalence?&quot;}"><h3>Did India overestimate anaemia prevalence?</h3><div class="ctls cod-ui"></div><div class="legend cod-legend"></div><div class="plot"><div class="cod-fallback"><a href="/charts/2026-11-23-anaemia.png"><img src="/charts/2026-11-23-anaemia.png" alt="Dumbbell chart comparing anaemia prevalence in NFHS-5 and SAMPADA. Children 12–59 months: 64% vs 41.8%, 25.2 points lower. Pregnant women: 52% vs 44%, 8 points lower. Men 15–49: 25% vs 19%, 6 points lower. Women 15–49: 57% vs 56%, 1 point lower." loading="lazy"></a></div><div class="cod-plot"></div></div></div>
      <p class="sub2">Share with anaemia (%). NFHS-5 (2019–21) measured haemoglobin in finger-prick (capillary) blood; ICMR&#x27;s SAMPADA survey (2023–25) used venous blood and laboratory analysers.</p>
      <p>Measured with the gold-standard method, anaemia is lower in every group compared, most of all among young children: 41.8% against 64% in NFHS-5. The gap varies widely, from 25 points for children to one point for women aged 15–49. ICMR cautions that the differences reflect how haemoglobin was measured and should not automatically be read as a fall over time. Either way, anaemia remains widespread: more than half of women and two in five young children.</p>
      <p class="src">Source: ICMR-NIN, SAMPADA 2023–25 fact sheets; PIB release of 23 November 2026 (SAMPADA vs NFHS-5 comparison)</p>
    </figure>
    <figure class="arc" id="2026-11-20">
      <time datetime="2026-11-20">20 November 2026</time>
      
      <div class="cod-int" data-spec="{&quot;type&quot;: &quot;line&quot;, &quot;data&quot;: &quot;/charts/data/2026-11-20-cpi-groups.csv&quot;, &quot;x&quot;: &quot;month&quot;, &quot;kind&quot;: &quot;pctx&quot;, &quot;series&quot;: [[&quot;all_items&quot;, &quot;All items&quot;, &quot;#FFFFFF&quot;, false, &quot;All items&quot;], [&quot;restaurants_accommodation&quot;, &quot;Restaurants and accommodation&quot;, &quot;#F3E67C&quot;, false, &quot;Restaurants&quot;], [&quot;food_and_beverages&quot;, &quot;Food and beverages&quot;, &quot;#F590C6&quot;, false, &quot;Food&quot;], [&quot;transport&quot;, &quot;Transport&quot;, &quot;#6FD3EA&quot;, false, &quot;Transport&quot;], [&quot;housing_fuel&quot;, &quot;Housing, water, electricity and fuel&quot;, &quot;#A99AF5&quot;, false, &quot;Housing, fuel&quot;]], &quot;hlines&quot;: [{&quot;v&quot;: 6, &quot;label&quot;: &quot;RBI&#x27;s 6% upper limit&quot;, &quot;short&quot;: &quot;6% limit&quot;}], &quot;unit&quot;: &quot;% change on the same month a year earlier&quot;, &quot;title&quot;: &quot;Food pushes retail inflation above 6%&quot;}"><h3>Food pushes retail inflation above 6%</h3><div class="ctls cod-ui"></div><div class="legend cod-legend"></div><div class="plot"><div class="cod-fallback"><a href="/charts/2026-11-20-cpi-groups.png"><img src="/charts/2026-11-20-cpi-groups.png" alt="Line chart of CPI inflation from January to October 2026 for all items and four groups. All items rises from 2.74% to 6.09%; food and beverages from 2.11% to 8.51%; restaurants and accommodation from 2.87% to 10.06%; transport from 0.09% to 5.84%; housing, water, electricity, gas and other fuels from 1.47% to 2.90%." loading="lazy"></a></div><div class="cod-plot"></div></div></div>
      <p class="sub2">Consumer price inflation by group, all India, % change on a year earlier, January to October 2026. CPI base 2024=100.</p>
      <p>Inflation has risen every month this year, from 2.74% in January to 6.09% in October, above the RBI&#x27;s 6% upper limit. Food and beverage inflation quadrupled, from 2.11% to 8.51%. Restaurant and hotel prices rose 10.06% on a year earlier and transport 5.84%, after being flat until April. Housing and fuel stayed below 3%.</p>
      <p class="src">Source: MoSPI Consumer Price Index (base 2024=100), all India, rural and urban combined, October 2026 provisional</p>
    </figure>
    <figure class="arc" id="2026-11-19">
      <time datetime="2026-11-19">19 November 2026</time>
      
      <div class="cod-int" data-spec="{&quot;data&quot;: &quot;/charts/data/2026-11-19-net-fpi.csv&quot;, &quot;x&quot;: &quot;date&quot;, &quot;measures&quot;: [{&quot;label&quot;: &quot;US$ billion&quot;, &quot;unit&quot;: &quot;US$ billion&quot;, &quot;bar&quot;: &quot;net_usd_bn&quot;, &quot;line&quot;: &quot;ma5_usd_bn&quot;, &quot;prefix&quot;: &quot;US$&quot;, &quot;suffix&quot;: &quot; bn&quot;, &quot;dec&quot;: 2, &quot;stack&quot;: [[&quot;equity_usd_bn&quot;, &quot;Equity&quot;], [&quot;debt_usd_bn&quot;, &quot;Debt&quot;], [&quot;hybrid_usd_bn&quot;, &quot;Hybrid&quot;], [&quot;mutual_funds_usd_bn&quot;, &quot;Mutual funds&quot;], [&quot;aifs_usd_bn&quot;, &quot;AIFs&quot;]]}, {&quot;label&quot;: &quot;₹ crore&quot;, &quot;unit&quot;: &quot;₹ crore&quot;, &quot;bar&quot;: &quot;net_cr&quot;, &quot;line&quot;: &quot;ma5_cr&quot;, &quot;prefix&quot;: &quot;₹&quot;, &quot;suffix&quot;: &quot; cr&quot;, &quot;dec&quot;: 0}], &quot;pos&quot;: &quot;Net inflow&quot;, &quot;neg&quot;: &quot;Net outflow&quot;, &quot;line_name&quot;: &quot;5-trading-day moving average&quot;, &quot;stack_name&quot;: &quot;By asset class&quot;, &quot;total_name&quot;: &quot;Total, all asset classes&quot;, &quot;extra&quot;: [[&quot;usd_inr&quot;, &quot;₹ per US$ (RBI reference rate)&quot;, 4]], &quot;title&quot;: &quot;Daily net FPI investment in India, March to November 2026&quot;}"><h3>Daily net FPI investment in India, March to November 2026</h3><div class="ctls cod-ui"></div><div class="legend cod-legend"></div><div class="plot"><div class="cod-fallback"><a href="/charts/2026-11-19-net-fpi.png"><img src="/charts/2026-11-19-net-fpi.png" alt="Bar chart of daily net foreign portfolio investment in India from March to November 2026 in US dollars, with a five-day moving average. Outflows dominate March, April and October; inflows dominate July and November." loading="lazy"></a></div><div class="cod-plot"></div></div></div>
      <p class="sub2">All asset classes (equity, debt, hybrid, mutual funds, AIFs), by NSDL reporting date. US dollar figures are NSDL&#x27;s, converted at the RBI reference rate for each day.</p>
      <p>Foreign portfolio investors pulled money out of India through March and April, turned buyers from late June, sold again from late September into October, and have bought heavily since the start of November.</p>
      <p class="src">Source: NSDL FPI Monitor, daily trends in FPI investments, data to 18 November 2026</p>
    </figure>
