name: Refresh national accounts data (GDP)

on:
  schedule:
    - cron: "13 8 * * *"   # daily, 08:13 UTC; commits only when MoSPI has published new numbers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_national_accounts.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain national-accounts/data)" ]; then
            git config user.name "indiaemerges-bot"
            git config user.email "actions@users.noreply.github.com"
            git add national-accounts/data
            git commit -m "Refresh national accounts data from MoSPI"
            git push
          fi
