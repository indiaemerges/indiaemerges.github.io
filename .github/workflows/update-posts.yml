name: Refresh Substack posts

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_posts.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "indiaemerges-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "Refresh latest posts"
            git push
          fi
