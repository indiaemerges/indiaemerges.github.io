name: Refresh industry data (IIP and ASI)

on:
  schedule:
    - cron: "43 7 * * *"   # daily, 07:43 UTC; commits only when MoSPI has published new numbers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_industry.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain industry/data)" ]; then
            git config user.name "indiaemerges-bot"
            git config user.email "actions@users.noreply.github.com"
            git add industry/data
            git commit -m "Refresh industry data from MoSPI"
            git push
          fi
