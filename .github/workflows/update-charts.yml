name: Publish chart of the day

on:
  push:
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_charts.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html charts/index.html)" ]; then
            git config user.name "indiaemerges-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html charts/index.html
            git commit -m "Publish chart of the day"
            git push
          fi
